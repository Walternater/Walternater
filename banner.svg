<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#131a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d0d8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#39d0d8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#8b9bb4" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#glow1)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>

  <!-- agent node network, right side -->
  <g stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.2">
    <line x1="880" y1="90"  x2="1010" y2="150"/>
    <line x1="1010" y1="150" x2="1120" y2="80"/>
    <line x1="1010" y1="150" x2="1060" y2="260"/>
    <line x1="880" y1="90"  x2="930"  y2="220"/>
    <line x1="930" y1="220" x2="1060" y2="260"/>
    <line x1="1060" y1="260" x2="1130" y2="330"/>
    <line x1="1010" y1="150" x2="900"  y2="320"/>
    <line x1="930" y1="220" x2="900"  y2="320"/>
  </g>
  <g fill="#39d0d8">
    <circle cx="880" cy="90" r="6"/>
    <circle cx="930" cy="220" r="4.5"/>
    <circle cx="900" cy="320" r="5"/>
  </g>
  <g fill="#a78bfa">
    <circle cx="1010" cy="150" r="7"/>
    <circle cx="1060" cy="260" r="5.5"/>
    <circle cx="1120" cy="80" r="4"/>
    <circle cx="1130" cy="330" r="4.5"/>
  </g>
  <circle cx="1010" cy="150" r="16" fill="#a78bfa" fill-opacity="0.25" filter="url(#soft)"/>
  <circle cx="880" cy="90" r="12" fill="#39d0d8" fill-opacity="0.25" filter="url(#soft)"/>

  <!-- text block -->
  <text x="72" y="150" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="17" letter-spacing="6" fill="#39d0d8">AGENT-ASSISTED · HUMAN-ACCOUNTABLE</text>
  <text x="70" y="225" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="62" font-weight="700" letter-spacing="2" fill="#f2f5fa">WANG CHONGFEI</text>
  <text x="72" y="285" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="25" fill="url(#accent)">AI writes the code. I read every line.</text>

  <line x1="72" y1="318" x2="560" y2="318" stroke="url(#accent)" stroke-width="1.4" stroke-opacity="0.7"/>
  <text x="72" y="356" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8b9bb4">Building toward a future where agents do the busywork</text>
  <text x="72" y="382" font-family="JetBrains Mono, SF Mono, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8b9bb4">and humans do the judging.</text>
</svg>
